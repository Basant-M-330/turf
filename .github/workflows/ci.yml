name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # next build doesn't need a reachable database (every page renders dynamically,
      # no data fetching happens at build time) — these just need to be present so
      # Prisma's schema validation and the Razorpay/NextAuth modules don't throw on import.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
      NEXTAUTH_SECRET: "ci-only-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field — passing `with: version`
      # here too conflicts with it (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
